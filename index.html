<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chicago · 12–15 nov</title>
<meta name="description" content="Nuestro itinerario de Chicago, día por día, para ir tachando.">
<meta name="theme-color" content="#14213D">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon fill='%23D9232E' points='50,5 61,31 89,28 72,50 89,72 61,69 50,95 39,69 11,72 28,50 11,28 39,31'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#B3DDF2;      /* azul de la bandera de Chicago */
  --star:#D9232E;     /* rojo de las estrellas */
  --ink:#14213D;
  --paper:#F7FAFC;
  --card:#FFFFFF;
  --muted:#5B6478;
  --line-soft:#DCE4EC;
  --done:#9AA3B2;
  --day:#00A1DE;
  --radius-lg:18px;
  --radius-sm:8px;
}
@media (prefers-color-scheme: dark){
  :root{
    --sky:#2C5A73;
    --ink:#E9EEF5;
    --paper:#0E1626;
    --card:#16213A;
    --muted:#A3AEC2;
    --line-soft:#26324D;
    --done:#6B7590;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Archivo",system-ui,sans-serif;font-variation-settings:"wdth" 100;
  font-size:16px;line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--star);outline-offset:2px;border-radius:6px}

/* ---------- Bandera / hero ---------- */
.flag{background:var(--paper);padding:20px 16px 18px}
.flag-inner{max-width:760px;margin:0 auto}
.stripe{height:14px;background:var(--sky);border-radius:3px}
.stars{display:flex;justify-content:space-between;gap:8px;padding:16px 4px}
.star-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer}
.star-day svg{width:min(64px,17vw);height:auto;display:block;transition:transform .25s ease}
.star-day .fill{fill:transparent;stroke:var(--star);stroke-width:5;transition:fill .4s ease}
.star-day .clip-fill{fill:var(--star)}
.star-day.complete svg{transform:rotate(30deg)}
.star-day span{font-size:13px;font-weight:600;color:var(--muted)}
.star-day[aria-current="true"] span{color:var(--ink)}
h1{
  font-weight:800;font-variation-settings:"wdth" 125;
  font-size:clamp(40px,11vw,76px);line-height:.95;letter-spacing:-.02em;
  margin:18px 0 6px;
}
.sub{color:var(--muted);margin:0;font-size:15px}
.sub b{color:var(--ink);font-weight:600}

/* ---------- Tabs ---------- */
nav.tabs{
  position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft);
}
.tabs-inner{max-width:760px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.tabs-inner::-webkit-scrollbar{display:none}
.tab{
  flex:none;border:2px solid var(--c);background:transparent;border-radius:999px;
  padding:6px 14px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;
}
.tab[aria-selected="true"]{background:var(--c);color:#fff}

main{max-width:760px;margin:0 auto;padding:18px 16px 60px}

/* ---------- Encabezado del día ---------- */
.day-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.day-head h2{
  margin:0;font-size:clamp(28px,7vw,40px);line-height:1;font-weight:800;font-variation-settings:"wdth" 112;
}
.wx{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line-soft)}
.day-note{color:var(--muted);margin:6px 0 14px;font-size:15px;max-width:62ch}
.progress{height:8px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin:0 0 22px}
.progress i{display:block;height:100%;width:0;background:var(--day);border-radius:99px;transition:width .4s ease}
.progress-label{font-size:13px;color:var(--muted);margin:-16px 0 20px}

/* ---------- Línea del L (timeline) ---------- */
.line{list-style:none;margin:0;padding:0;position:relative}
.line::before{
  content:"";position:absolute;left:21px;top:8px;bottom:8px;width:8px;border-radius:4px;background:var(--day);
}
.stop{position:relative;padding-left:62px;margin-bottom:14px}
.station{
  position:absolute;left:8px;top:14px;width:34px;height:34px;border-radius:50%;
  background:var(--card);border:6px solid var(--ink);cursor:pointer;padding:0;
  display:grid;place-items:center;transition:background .2s ease,border-color .2s ease;
}
.station svg{width:16px;height:16px;opacity:0;transition:opacity .2s}
.stop.done .station{background:var(--day);border-color:var(--day)}
.stop.done .station svg{opacity:1}
.stop.next .station{box-shadow:0 0 0 5px color-mix(in srgb,var(--day) 30%,transparent)}
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius-lg);padding:14px 16px;overflow:hidden}
.photo{display:block;width:calc(100% + 32px);margin:-14px -16px 12px;aspect-ratio:16/9;object-fit:cover;background:var(--line-soft)}
.check .thumb{width:72px;height:72px;border-radius:12px;object-fit:cover;flex:none;background:var(--line-soft);margin-left:auto}
.check > div{flex:1;min-width:0}
.stop.done .card{opacity:.62}
.stop.done .title{text-decoration:line-through;text-decoration-thickness:2px;color:var(--done)}
.time{font-weight:800;font-variation-settings:"wdth" 80;font-size:15px;color:var(--muted);letter-spacing:.01em}
.title{font-weight:700;font-size:18px;line-height:1.25;margin:2px 0 6px}
.desc{margin:0;color:var(--ink);font-size:15px}
.desc p{margin:0 0 6px}
.tip{
  margin-top:10px;padding:8px 12px;border-radius:var(--radius-sm);font-size:14px;
  background:color-mix(in srgb,var(--sky) 45%,transparent);
}
.transit{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:14px;color:var(--muted)}
.chip{
  display:inline-flex;align-items:center;gap:5px;color:#fff;font-weight:700;font-size:12.5px;
  padding:3px 9px;border-radius:999px;background:var(--cc,#555);white-space:nowrap;
}
.chip.walk{background:transparent;color:var(--ink);border:1.5px solid var(--line-soft)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:14px;
  padding:8px 14px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;cursor:pointer;
}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn svg{width:16px;height:16px}

/* ---------- Listas (extras / reservas) ---------- */
.group-title{font-size:20px;font-weight:800;font-variation-settings:"wdth" 110;margin:26px 0 10px}
.group-title:first-of-type{margin-top:6px}
.check-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.check{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:12px 14px}
.check .station{position:static;flex:none;width:28px;height:28px;border-width:5px;margin-top:2px}
.check.done .station{background:var(--day);border-color:var(--day)}
.check.done .station svg{opacity:1}
.check.done .title{text-decoration:line-through;color:var(--done)}
.check .title{font-size:16px;margin:0 0 2px}
.check .desc{font-size:14px;color:var(--muted)}
.check .actions{margin-top:8px}
.check .btn{padding:5px 11px;font-size:13px}

/* ---------- Pie ---------- */
.foot{border-top:1px solid var(--line-soft);margin-top:36px;padding-top:18px;color:var(--muted);font-size:14px}
.foot .actions{margin-bottom:12px}
.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,40px);
  background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;
  opacity:0;pointer-events:none;transition:all .25s ease;z-index:20;max-width:calc(100% - 32px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (min-width:700px){.stop{padding-left:72px}.line::before{left:25px}.station{left:12px}}
</style>
</head>

};

/* ======================= Estado ======================= */
const KEY = "chi-trip-v1";
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch(e) {} }

// Importar progreso compartido (#p=id,id,...)
(function importShared(){
  const m = location.hash.match(/p=([^&]+)/);
  if (!m) return;
  const ids = decodeURIComponent(m[1]).split(",").filter(Boolean);
  ids.forEach(id => done.add(id));
  save();
  history.replaceState(null, "", location.pathname);
  setTimeout(() => toast(`Importamos ${ids.length} palomitas de tu pareja`), 300);
})();

/* ======================= Utilidades ======================= */
const $ = s => document.querySelector(s);
const enc = encodeURIComponent;
const dirUrl = p => `https://www.google.com/maps/dir/?api=1&destination=${enc(p)}&travelmode=transit`;
const placeUrl = p => `https://www.google.com/maps/search/?api=1&query=${enc(p)}`;
const ICON = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  nav:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1"/><path d="M14 10a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg>',
};
const STAR_PTS = "50,4 60,33 92,27 70,50 92,73 60,67 50,96 40,67 8,73 30,50 8,27 40,33";

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2400);
}
function chips(transit){
  if (!transit) return "";
  return `<div class="transit">${transit.map(([k,txt]) => {
    if (k === "walk") return `<span class="chip walk">🚶 ${txt}</span>`;
    const [name,col] = L[k];
    return `<span class="chip" style="--cc:${col}">${name}${txt ? " · "+txt : ""}</span>`;
  }).join("")}</div>`;
}
function stationBtn(id, label){
  return `<button class="station" data-id="${id}" aria-pressed="${done.has(id)}" aria-label="Marcar: ${label.replace(/"/g,"")}">${ICON.check}</button>`;
}

/* ======================= Render ======================= */
const TABS = [...DAYS.map(d => ({id:d.id, label:d.tab, color:d.color})),
  {id:"extras", label:"Si sobra tiempo", color:"#009B3A"},
  {id:"reservas", label:"Reservas", color:"#62361B"}];

function chicagoNow(){
  const p = new Intl.DateTimeFormat("en-CA",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  return p; // YYYY-MM-DD
}
function defaultTab(){
  const map = {"2026-11-12":"jue","2026-11-13":"vie","2026-11-14":"sab","2026-11-15":"dom"};
  return map[chicagoNow()] || (chicagoNow() < "2026-11-12" ? "reservas" : "jue");
}
let current = (() => { try { return sessionStorage.getItem(KEY+"-tab"); } catch(e){ return null; } })() || defaultTab();

function renderStars(){
  $("#stars").innerHTML = DAYS.map(d => {
    const ids = d.stops.map(s => s.id);
    const n = ids.filter(id => done.has(id)).length;
    const pct = n / ids.length;
    const complete = pct === 1;
    return `<button class="star-day ${complete ? "complete":""}" data-tab="${d.id}" aria-current="${current===d.id}" aria-label="${d.name}: ${n} de ${ids.length}">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs><clipPath id="c-${d.id}"><rect x="0" y="${100 - pct*100}" width="100" height="100"/></clipPath></defs>
        <polygon class="clip-fill" points="${STAR_PTS}" clip-path="url(#c-${d.id})"/>
        <polygon class="fill" points="${STAR_PTS}"/>
      </svg>
      <span>${d.tab}</span></button>`;
  }).join("");
}

function renderTabs(){
  $("#tabs").innerHTML = TABS.map(t =>
    `<button class="tab" role="tab" style="--c:${t.color}" data-tab="${t.id}" aria-selected="${current===t.id}">${t.label}</button>`).join("");
  const sel = $(`.tab[data-tab="${current}"]`);
  if (sel) sel.scrollIntoView({inline:"center", block:"nearest"});
}

function renderDay(d){
  const ids = d.stops.map(s => s.id);
  const n = ids.filter(id => done.has(id)).length;
  const nextId = ids.find(id => !done.has(id));
  document.documentElement.style.setProperty("--day", d.color);
  return `
    <div class="day-head"><h2>${d.name}</h2><span class="wx">${d.wx}</span></div>
    <p class="day-note">${d.note}</p>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${ids.length}" aria-valuenow="${n}"><i style="width:${n/ids.length*100}%"></i></div>
    <p class="progress-label">${n} de ${ids.length} paradas${n===ids.length ? " · ¡día completo! ⭐" : ""}</p>
    <ol class="line">
      ${d.stops.map(s => `
      <li class="stop ${done.has(s.id) ? "done":""} ${s.id===nextId ? "next":""}">
        ${stationBtn(s.id, s.title)}
        <div class="card">
          ${IMG[s.id] ? `<img class="photo" src="${IMG[s.id]}" alt="${s.title.replace(/"/g,"")}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
          <div class="time">${s.t}</div>
          <div class="title">${s.title}</div>
          <div class="desc">${s.desc.startsWith("<p>") ? s.desc : `<p>${s.desc}</p>`}</div>
          ${chips(s.transit)}
          ${s.tip ? `<div class="tip">💡 ${s.tip}</div>` : ""}
          ${s.place ? `<div class="actions">
            <a class="btn primary" href="${dirUrl(s.place)}" target="_blank" rel="noopener">${ICON.nav} Cómo llegar</a>
            <a class="btn" href="${placeUrl(s.place)}" target="_blank" rel="noopener">${ICON.pin} Fotos y reseñas</a>
          </div>` : ""}
        </div>
      </li>`).join("")}
    </ol>`;
}

function renderList(groups, color){
  document.documentElement.style.setProperty("--day", color);
  return groups.map(g => `
    <h3 class="group-title">${g.title}</h3>
    <ul class="check-list">
      ${g.items.map(it => `
      <li class="check ${done.has(it.id) ? "done":""}">
        ${stationBtn(it.id, it.title)}
        <div>
          <div class="title">${it.title}</div>
          <div class="desc">${it.desc}</div>
          ${(it.place || it.url) ? `<div class="actions">
            ${it.place ? `<a class="btn" href="${dirUrl(it.place)}" target="_blank" rel="noopener">${ICON.nav} Cómo llegar</a><a class="btn" href="${placeUrl(it.place)}" target="_blank" rel="noopener">${ICON.pin} Fotos y reseñas</a>` : ""}
            ${it.url ? `<a class="btn" href="${it.url}" target="_blank" rel="noopener">${ICON.link} Abrir</a>` : ""}
          </div>` : ""}
        </div>
        ${IMG[it.id] ? `<img class="thumb" src="${IMG[it.id]}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
      </li>`).join("")}
    </ul>`).join("");
}

function footer(){
  return `<div class="foot">
    <div class="actions">
      <button class="btn primary" id="share">${ICON.link} Compartir mi progreso</button>
      <button class="btn" id="reset">Borrar palomitas</button>
    </div>
    <p>Cada celular guarda sus palomitas. Para pasarle las tuyas a tu pareja, toca “Compartir mi progreso” y mándale el link: al abrirlo se suman a las suyas.</p>
    <p>Metro: tarjeta o Apple Pay en el torniquete ($2.50; desde O'Hare $5). Pase de 3 días $15 en la app Ventra. Horarios revisados el 12 nov 2026; confirmar en Google Maps antes de ir.</p>
  </div>`;
}

function render(){
  const main = $("#main");
  if (current === "extras") main.innerHTML = `<div class="day-head"><h2>Si sobra tiempo</h2></div><p class="day-note">Opcionales para meter donde quepan, sin prisas y de regreso antes de las 22:00.</p>` + renderList(EXTRAS, "#009B3A") + footer();
  else if (current === "reservas") main.innerHTML = `<div class="day-head"><h2>Reservas</h2></div><p class="day-note">Las 5 atracciones del CityPASS piden horario reservado. Mejor dejarlas listas desde hoy.</p>` + renderList(RESERVAS, "#62361B") + footer();
  else main.innerHTML = renderDay(DAYS.find(d => d.id === current)) + footer();
  renderStars(); renderTabs();
}

/* ======================= Eventos ======================= */
document.addEventListener("click", e => {
  const st = e.target.closest(".station");
  if (st){
    const id = st.dataset.id;
    done.has(id) ? done.delete(id) : done.add(id);
    save(); render();
    const again = document.querySelector(`.station[data-id="${id}"]`); if (again) again.focus({preventScroll:true});
    return;
  }
  const tab = e.target.closest("[data-tab]");
  if (tab){
    current = tab.dataset.tab;
    try { sessionStorage.setItem(KEY+"-tab", current); } catch(e){}
    render(); window.scrollTo({top: document.querySelector("nav.tabs").offsetTop, behavior:"smooth"});
    return;
  }
  if (e.target.closest("#share")){
    const url = `${location.origin}${location.pathname}#p=${enc([...done].join(","))}`;
    if (navigator.share) navigator.share({title:"Mi progreso en Chicago", url}).catch(()=>{});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast("Link copiado"), () => prompt("Copia este link:", url));
    return;
  }
  if (e.target.closest("#reset")){
    if (done.size && confirm("¿Borrar todas las palomitas de este celular?")){ done.clear(); save(); render(); toast("Palomitas borradas"); }
  }
});

render();
</script>
