<style>
:root{
  --sky:#A9D4EC;
  --star:#D9232E;
  --sign:#FFFFFF;
  --sign-text:#111827;
  --ink:#111827;
  --serif:"Newsreader",Georgia,serif;
  --paper:#FFFFFF;
  --wash:#F1F4F7;
  --muted:#5D6677;
  --rule:#D9DFE6;
  --done:#9BA3B1;
  --day:#00A1DE;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Archivo",system-ui,sans-serif;font-size:16px;line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--star);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

header{padding:22px 0 26px}
.stripe{height:12px;background:var(--sky)}
.stars{display:flex;justify-content:space-between;padding:14px 2px}
.star-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;cursor:pointer}
.star-day svg{width:min(60px,16vw);height:auto;display:block}
.star-day .outline{fill:none;stroke:var(--star);stroke-width:5;stroke-linejoin:round}
.star-day .solid{fill:var(--star)}
.star-day span{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.star-day[aria-current="true"] span{color:var(--ink)}
h1{
  font-weight:800;font-variation-settings:"wdth" 125;
  font-size:clamp(44px,12.5vw,84px);line-height:.9;letter-spacing:-.025em;margin:22px 0 10px;
}
.lede{margin:0;color:var(--muted);max-width:52ch}

nav.tabs{position:sticky;top:0;z-index:5;background:var(--sign);color:var(--sign-text)}
.tabs-inner{display:flex;overflow-x:auto;scrollbar-width:none}
.tabs-inner::-webkit-scrollbar{display:none}
.tab{
  flex:none;border:0;background:transparent;color:inherit;cursor:pointer;white-space:nowrap;
  padding:13px 14px 11px;font-weight:700;font-size:15px;border-bottom:4px solid transparent;opacity:.72;
}
.tab[aria-selected="true"]{border-bottom-color:var(--c);opacity:1}

main{padding:0 0 64px}

.sign{
  background:var(--sign);color:var(--sign-text);margin:0 -16px;padding:22px 16px 20px;
  border-top:1px solid rgba(255,255,255,.12);
}
.sign-row{display:flex;gap:12px;align-items:stretch}
.sign-bar{width:10px;background:var(--day);flex:none}
.sign h2{margin:0;font-size:clamp(30px,8vw,44px);line-height:1;font-weight:800;font-variation-settings:"wdth" 110}
.sign .meta{margin:6px 0 0;font-size:14px;opacity:.82}
.sign .note{margin:14px 0 0;font-size:15px;opacity:.92;max-width:58ch}
.meter{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:13px;opacity:.9;font-variant-numeric:tabular-nums}
.meter-track{flex:1;height:6px;background:rgba(255,255,255,.18)}
.meter-track i{display:block;height:100%;background:var(--day);transition:width .35s ease}

.route{list-style:none;margin:0;padding:24px 0 0}
.stop{display:grid;grid-template-columns:52px 30px 1fr;column-gap:10px;position:relative}
.stop .clock{
  font-weight:800;font-variation-settings:"wdth" 75;font-size:19px;line-height:1.1;
  font-variant-numeric:tabular-nums;text-align:right;padding-top:9px;
}
.stop .clock small{display:block;font-weight:600;font-size:12px;color:var(--muted);margin-top:2px}
.track{position:relative;display:flex;justify-content:center}
.track::before{content:"";position:absolute;top:0;bottom:0;width:8px;background:var(--day)}
.stop:first-child .track::before{top:12px}
.stop:last-child .track::before{bottom:auto;height:20px}
.station{
  position:relative;z-index:1;margin-top:8px;width:26px;height:26px;border-radius:50%;
  background:var(--paper);border:5px solid var(--ink);padding:0;cursor:pointer;
  display:grid;place-items:center;
}
.station svg{width:12px;height:12px;opacity:0}
.done .station{background:var(--ink)}
.done .station svg{opacity:1}
.body{padding:6px 0 30px;min-width:0}
.body h3{margin:0;font-size:19px;line-height:1.2;font-weight:700}
.done .body h3{color:var(--done);text-decoration:line-through;text-decoration-thickness:2px}
.done .body .fade{opacity:.55}
.photo{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;margin:12px 0 2px;background:var(--wash)}
.body p{margin:10px 0 0;font-size:15.5px}
.ride{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.ride li{display:flex;align-items:center;gap:9px;font-size:14.5px}
.bullet{
  flex:none;min-width:58px;text-align:center;color:#fff;font-weight:800;font-size:12px;letter-spacing:.01em;
  padding:3px 6px;background:var(--lc,#555);font-variation-settings:"wdth" 85;
}
.bullet.walk{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--rule)}
.note-box{margin:12px 0 0;padding:10px 12px;background:var(--wash);font-size:14.5px;border-left:4px solid var(--day)}
.note-box b{font-weight:700}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-weight:700;font-size:14px;
  padding:9px 14px;border:1.5px solid var(--ink);background:transparent;cursor:pointer;
}
.btn.solid{background:var(--ink);color:var(--paper)}

.list-title{font-size:21px;font-weight:800;font-variation-settings:"wdth" 108;margin:30px 0 4px}
.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:30px 1fr 84px;gap:12px;padding:16px 0;border-bottom:1px solid var(--rule)}
.item.no-img{grid-template-columns:30px 1fr}
.item .station{margin-top:0}
.item h4{margin:0;font-size:16.5px;line-height:1.25}
.item.done h4{color:var(--done);text-decoration:line-through}
.item p{margin:4px 0 0;font-size:14.5px;color:var(--muted)}
.item .links{margin-top:10px}
.item .btn{padding:6px 11px;font-size:13px}
.thumb{width:84px;height:84px;object-fit:cover;background:var(--wash)}

.foot{margin-top:34px;padding-top:20px;border-top:1px solid var(--rule);font-size:14px;color:var(--muted)}
.foot .links{margin:0 0 14px}
.foot p{margin:0 0 8px;max-width:60ch}
.toast{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,30px);
  background:#111827;color:#fff;padding:10px 16px;font-weight:600;font-size:14px;
  opacity:0;pointer-events:none;transition:all .25s ease;z-index:20;max-width:calc(100% - 32px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---- Editorial ---- */
h1{font-family:var(--serif);font-weight:500;font-variation-settings:normal;font-size:clamp(56px,16vw,104px);letter-spacing:-.03em;line-height:.92}
.lede{font-family:var(--serif);font-size:19px;line-height:1.45;color:#3F4654}
nav.tabs{border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.tab{opacity:.55;font-weight:600}
.tab[aria-selected="true"]{opacity:1}
.sign{border-top:0;border-bottom:1px solid var(--ink);padding:34px 16px 24px}
.sign-bar{width:6px}
.sign h2{font-family:var(--serif);font-weight:500;font-variation-settings:normal;font-size:clamp(38px,10vw,56px);letter-spacing:-.02em}
.sign .meta{opacity:1;color:var(--muted);font-size:14px;margin-top:8px}
.sign .note{font-family:var(--serif);font-size:18px;line-height:1.45;opacity:1}
.meter{opacity:1;color:var(--muted)}
.meter-track{background:var(--rule);height:4px}
.body h3{font-family:var(--serif);font-weight:600;font-size:23px;letter-spacing:-.01em;line-height:1.15}
.body p{font-family:var(--serif);font-size:17.5px;line-height:1.55}
.list-title{font-family:var(--serif);font-weight:500;font-variation-settings:normal;font-size:28px;letter-spacing:-.01em}
.item h4{font-family:var(--serif);font-weight:600;font-size:19px}
.note-box{background:transparent;border-left:3px solid var(--day);padding:2px 0 2px 12px;color:#3F4654;font-style:normal}
.photo{margin-top:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (min-width:640px){
  .stop{grid-template-columns:64px 34px 1fr;column-gap:14px}
  .sign{margin:0;padding:24px 22px}
}
</style>
</head>

const KEY = "chi-trip-v1";
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch(e) {} }

(function importShared(){
  const m = location.hash.match(/p=([^&]+)/);
  if (!m) return;
  const ids = decodeURIComponent(m[1]).split(",").filter(Boolean);
  ids.forEach(id => done.add(id)); save();
  history.replaceState(null, "", location.pathname);
  setTimeout(() => toast(`Se sumaron ${ids.length} paradas tachadas`), 300);
})();

const $ = s => document.querySelector(s);
const enc = encodeURIComponent;
const dirUrl = p => `https://www.google.com/maps/dir/?api=1&destination=${enc(p)}&travelmode=transit`;
const placeUrl = p => `https://www.google.com/maps/search/?api=1&query=${enc(p)}`;
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="color:var(--paper)"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const STAR = "50,4 60,33 92,27 70,50 92,73 60,67 50,96 40,67 8,73 30,50 8,27 40,33";
const img = (key, cls, alt="") => PH[key] ? `<img class="${cls}" src="${PH[key]}" alt="${alt}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : "";

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2400);
}
function ride(r){
  if (!r) return "";
  return `<ul class="ride">${r.map(([k,txt]) => k === "walk"
    ? `<li><span class="bullet walk">A pie</span>${txt}</li>`
    : `<li><span class="bullet" style="--lc:${LINE[k][1]}">${LINE[k][0]}</span>${txt}</li>`).join("")}</ul>`;
}
const station = (id, label) =>
  `<button class="station" data-id="${id}" aria-pressed="${done.has(id)}" aria-label="Marcar ${label.replace(/"/g,"")}">${CHECK}</button>`;
const links = p => p ? `<div class="links">
  <a class="btn solid" href="${dirUrl(p)}" target="_blank" rel="noopener">Cómo llegar</a>
  <a class="btn" href="${placeUrl(p)}" target="_blank" rel="noopener">Fotos y reseñas</a></div>` : "";

const TABS = [...DAYS.map(d => ({id:d.id, label:d.tab, color:d.color})),
  {id:"extras", label:"Si sobra tiempo", color:"#009B3A"},
  {id:"reservas", label:"Reservas", color:"#F9A825"}];

function chicagoDate(){
  return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
}
function defaultTab(){
  const d = chicagoDate();
  return {"2026-11-12":"jue","2026-11-13":"vie","2026-11-14":"sab","2026-11-15":"dom"}[d] || (d < "2026-11-12" ? "reservas" : "jue");
}
let current = (() => { try { return sessionStorage.getItem(KEY+"-tab"); } catch(e){ return null; } })() || defaultTab();

function renderStars(){
  $("#stars").innerHTML = DAYS.map(d => {
    const ids = d.stops.map(s => s.id), n = ids.filter(id => done.has(id)).length, pct = n/ids.length;
    return `<button class="star-day" data-tab="${d.id}" aria-current="${current===d.id}" aria-label="${d.name}: ${n} de ${ids.length}">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs><clipPath id="c-${d.id}"><rect x="0" y="${100-pct*100}" width="100" height="100"/></clipPath></defs>
        <polygon class="solid" points="${STAR}" clip-path="url(#c-${d.id})"/>
        <polygon class="outline" points="${STAR}"/>
      </svg><span>${d.tab}</span></button>`;
  }).join("");
}
function renderTabs(){
  $("#tabs").innerHTML = TABS.map(t =>
    `<button class="tab" role="tab" style="--c:${t.color}" data-tab="${t.id}" aria-selected="${current===t.id}">${t.label}</button>`).join("");
  const sel = $(`.tab[data-tab="${current}"]`); if (sel) sel.scrollIntoView({inline:"center", block:"nearest"});
}
function sign(title, meta, note, n, total){
  return `<section class="sign"><div class="sign-row"><div class="sign-bar"></div><div style="flex:1">
    <h2>${title}</h2>${meta ? `<p class="meta">${meta}</p>` : ""}${note ? `<p class="note">${note}</p>` : ""}
    ${total ? `<div class="meter"><div class="meter-track"><i style="width:${n/total*100}%"></i></div>${n} de ${total}</div>` : ""}
  </div></div></section>`;
}
function renderDay(d){
  document.documentElement.style.setProperty("--day", d.color);
  const ids = d.stops.map(s => s.id), n = ids.filter(id => done.has(id)).length;
  return sign(d.name, d.meta, d.note, n, ids.length) + `<ol class="route">${d.stops.map(s => `
    <li class="stop ${done.has(s.id) ? "done" : ""}">
      <div class="clock">${s.t}${s.end ? `<small>a ${s.end}</small>` : ""}</div>
      <div class="track">${station(s.id, s.title)}</div>
      <div class="body">
        <h3>${s.title}</h3>
        <div class="fade">
          ${img(s.img, "photo", s.title)}
          ${s.text ? `<p>${s.text}</p>` : ""}
          ${ride(s.ride)}
          ${s.note ? `<div class="note-box">${s.note}</div>` : ""}
          ${links(s.place)}
        </div>
      </div>
    </li>`).join("")}</ol>`;
}
function renderList(groups, color, title, note){
  document.documentElement.style.setProperty("--day", color);
  const all = groups.flatMap(g => g.items.map(i => i.id)), n = all.filter(id => done.has(id)).length;
  return sign(title, "", note, n, all.length) + groups.map(g => `
    <h3 class="list-title">${g.title}</h3>
    <ul class="items">${g.items.map(it => `
      <li class="item ${done.has(it.id) ? "done" : ""} ${PH[it.img] ? "" : "no-img"}">
        ${station(it.id, it.title)}
        <div>
          <h4>${it.title}</h4><p>${it.text}</p>
          ${(it.place || it.url) ? `<div class="links">
            ${it.place ? `<a class="btn" href="${dirUrl(it.place)}" target="_blank" rel="noopener">Cómo llegar</a><a class="btn" href="${placeUrl(it.place)}" target="_blank" rel="noopener">Fotos y reseñas</a>` : ""}
            ${it.url ? `<a class="btn" href="${it.url}" target="_blank" rel="noopener">Abrir sitio</a>` : ""}
          </div>` : ""}
        </div>
        ${img(it.img, "thumb")}
      </li>`).join("")}</ul>`).join("");
}
function footer(){
  return `<div class="foot">
    <div class="links"><button class="btn solid" id="share">Compartir mi progreso</button><button class="btn" id="reset">Borrar lo tachado</button></div>
    <p>Lo tachado se guarda en cada celular. “Compartir mi progreso” genera un link; al abrirlo en el otro celular se suman las paradas.</p>
    <p>Metro: $2.50 por viaje con tarjeta o Apple Pay ($5 saliendo de O'Hare). Pase de 3 días: $15 en la app Ventra. Horarios revisados el 12 de noviembre de 2026; confirmar en Google Maps antes de ir.</p>
  </div>`;
}
function render(){
  let html;
  if (current === "extras") html = renderList(EXTRAS, "#009B3A", "Si sobra tiempo", "Opcionales para meter donde quepan, sin prisas y en el hotel antes de las 22:00.");
  else if (current === "reservas") html = renderList(RESERVAS, "#F9A825", "Reservas", "Las cinco atracciones del CityPASS piden horario reservado.");
  else html = renderDay(DAYS.find(d => d.id === current));
  $("#main").innerHTML = html + footer();
  renderStars(); renderTabs();
}

document.addEventListener("click", e => {
  const st = e.target.closest(".station");
  if (st){
    const id = st.dataset.id; done.has(id) ? done.delete(id) : done.add(id); save(); render();
    const again = document.querySelector(`.station[data-id="${id}"]`); if (again) again.focus({preventScroll:true});
    return;
  }
  const tab = e.target.closest("[data-tab]");
  if (tab){
    current = tab.dataset.tab; try { sessionStorage.setItem(KEY+"-tab", current); } catch(e){}
    render(); window.scrollTo({top: document.querySelector("nav.tabs").offsetTop, behavior:"smooth"}); return;
  }
  if (e.target.closest("#share")){
    const url = `${location.origin}${location.pathname}#p=${enc([...done].join(","))}`;
    if (navigator.share) navigator.share({title:"Chicago: lo que ya hicimos", url}).catch(()=>{});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast("Link copiado"), () => prompt("Copia este link:", url));
    return;
  }
  if (e.target.closest("#reset") && done.size && confirm("¿Borrar todo lo tachado en este celular?")){
    done.clear(); save(); render(); toast("Listo, todo sin tachar");
  }
});
render();
</script>
